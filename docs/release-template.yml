# Release your app: build it for Mac and Windows, sign it, and publish it as a GitHub release, which is also
# your app's update feed. Copy this file to .github/workflows/release.yml in your fork, then start it from your
# default branch when you're ready (Actions > release > Run workflow, or `gh workflow run release.yml`).
#
# It runs only when you start it: never on a push or a pull request. Every action is pinned to a commit SHA.
#
# The version is app/desktop/package.json's, and the tag is v<version>. The release goes to the repository your
# identity.json names in "releases" (plugins/<id>/identity.json, the id in package.json's "plugin"), which must
# be this one: it publishes with this run's own token, and your app reads its updates from there.
#
# Signing (an unsigned app isn't a release, so a missing secret stops the run):
#   Mac      MAC_CERTIFICATE_P12_BASE64 and MAC_CERTIFICATE_PASSWORD: your Developer ID Application
#            certificate. APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER: an App Store Connect API
#            key, for notarization.
#   Windows  WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD: a code-signing certificate, and
#            the repository variable WINDOWS_PUBLISHER: the name it's issued to, exactly. The build pins it in
#            your update feed, so your app refuses updates signed by anyone else.
# Keep them in a protected environment that only your default branch can use, and set the repository
# variable SIGNING_ENVIRONMENT to its name: the signing jobs run in it.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.id.outputs.version }}
      publisher: ${{ steps.id.outputs.publisher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The version, the repository and the publisher (app/desktop/package.json, identity.json)
        id: id
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
            echo "::error::release from $DEFAULT_REF, not $GITHUB_REF"
            exit 1
          fi
          plugin=$(node -p 'require("./package.json").plugin')
          identity="plugins/$plugin/identity.json"
          repo=$(node -p 'const r = require("./" + process.argv[1]).releases; r ? r.owner + "/" + r.repo : ""' "$identity")
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::$identity names \"${repo:-no releases}\" as the app's releases, not $GITHUB_REPOSITORY: set its releases to this repository"
            exit 1
          fi
          if [ -z "$PUBLISHER" ]; then
            echo "::error::no WINDOWS_PUBLISHER: set the repository variable to the name your Windows certificate is issued to"
            exit 1
          fi
          version=$(node -p 'require("./app/desktop/package.json").version')
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$version is already released: raise the version in app/desktop/package.json"
            exit 1
          fi
          {
            echo "version=$version"
            echo "publisher=$PUBLISHER"
          } >> "$GITHUB_OUTPUT"

  capture-windows:
    # The Windows screen-reading helper, cross-compiled with the pinned zig (twice, the same bytes).
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Zig (pinned, checksum checked)
        run: bridge/capture/windows/fetch-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_ENV"
      - name: Build
        run: bridge/capture/windows/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-windows-helper
          path: bridge/capture/windows/build
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: identity
    runs-on: macos-latest
    environment: ${{ vars.SIGNING_ENVIRONMENT }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: app/desktop
      - name: The signing secrets are there
        env:
          HAVE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' && secrets.MAC_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: |
          if [ "$HAVE" != true ]; then
            echo "::error::the Mac build needs MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER"
            exit 1
          fi
      - name: The notarization key, for this job only
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize (scripts/dist.mjs; it builds the screen-reading helper first)
        working-directory: app/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/dist.mjs --mac --publish never
      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in app/desktop/dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"
      - name: Check fuses, signatures and Gatekeeper
        run: |
          for app in app/desktop/dist/mac*/*.app; do
            node tools/check-fuses.mjs "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            node tools/check-release.mjs "$app"
          done
          for dmg in app/desktop/dist/*.dmg; do xcrun stapler validate "$dmg"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            app/desktop/dist/*.dmg
            app/desktop/dist/*.zip
            app/desktop/dist/*.blockmap
            app/desktop/dist/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: [identity, capture-windows]
    runs-on: windows-latest
    environment: ${{ vars.SIGNING_ENVIRONMENT }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: app/desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-windows-helper
          path: bridge/capture/windows/build
      - name: The signing secrets are there
        env:
          HAVE: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          if [ "$HAVE" != true ]; then
            echo "::error::the Windows build needs WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD"
            exit 1
          fi
      - name: Build and sign (scripts/dist.mjs; it pins the publisher, so the app refuses updates from anyone else)
        working-directory: app/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          NQA_PUBLISHER_NAME: ${{ needs.identity.outputs.publisher }}
        run: node scripts/dist.mjs --win nsis --x64 --publish never
      - name: Check fuses and signatures
        run: |
          node tools/check-fuses.mjs app/desktop/dist/win-unpacked
          pwsh -NoProfile -File tools/check-signatures.ps1 -Path app/desktop/dist
          node tools/check-update-signature.mjs app/desktop/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            app/desktop/dist/*.exe
            app/desktop/dist/*.blockmap
            app/desktop/dist/latest.yml
          if-no-files-found: error

  release:
    needs: [identity, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release
      - name: The SBOM, every package your app ships (CycloneDX, from app/desktop's lockfile; tools/sbom.mjs)
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node tools/sbom.mjs --out "release/sbom-$VERSION.cdx.json"
      - name: Checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -printf '%f\n' | sort > ../files.txt
          xargs -d '\n' sha256sum < ../files.txt > SHA256SUMS.txt
          xargs -d '\n' sha512sum < ../files.txt > SHA512SUMS.txt
          cat SHA256SUMS.txt
      - name: Provenance, in a public repository (GitHub attests only there on most plans)
        id: gate
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: echo "attest=$([ "$PRIVATE" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.gate.outputs.attest == 'true'
        with:
          subject-checksums: release/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes release/*
