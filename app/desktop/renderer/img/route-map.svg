<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440">
  <!-- The welcome's picture: Bones's priority route drawn on a zone map (an illustration, no game art). Flat colours: no gradients in the app. -->
  <defs>
    <clipPath id="frame"><rect x="8" y="8" width="464" height="424" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="464" height="424" fill="#1b1914"/>
    <!-- Zones: soft terrain patches. -->
    <path d="M8 300 C70 270 120 300 170 280 C230 256 250 310 320 300 C380 292 420 330 472 318 L472 432 L8 432 Z" fill="#1c1a14"/>
    <path d="M300 8 C290 60 330 90 380 96 C420 100 450 130 472 128 L472 8 Z" fill="#1e1c16"/>
    <path d="M8 60 C60 72 88 120 70 170 C56 210 20 222 8 230 Z" fill="#1b1914"/>
    <!-- A lake and a river. -->
    <path d="M338 214 C366 196 414 204 424 236 C434 268 398 290 364 282 C330 274 312 236 338 214 Z" fill="#1a2630"/>
    <path d="M424 236 C446 226 458 206 472 200" fill="none" stroke="#1d2a33" stroke-width="10" stroke-linecap="round"/>
    <!-- Contour lines. -->
    <g fill="none" stroke="#2c281f" stroke-width="1.4">
      <path d="M40 110 C90 90 140 118 170 100 C200 82 232 96 250 80"/>
      <path d="M52 132 C100 116 144 140 180 124 C214 108 240 122 262 106"/>
      <path d="M150 380 C200 352 250 370 290 356 C330 342 370 362 410 350"/>
      <path d="M170 404 C214 382 262 396 300 384 C340 372 380 388 430 378"/>
    </g>
    <!-- Roads. -->
    <path d="M8 196 C90 206 140 188 200 204 C260 220 290 180 340 170 C380 162 420 150 472 158" fill="none" stroke="#3a3428" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
    <!-- The route: done legs quiet, the next legs gold. -->
    <path d="M96 344 L150 268" fill="none" stroke="#6b5a40" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 268 L232 226 L300 132 L398 92 L412 176" fill="none" stroke="#e3a458" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The player: an arrow on the first stop. -->
    <g transform="translate(96 344) rotate(-35)">
      <path d="M0 -15 L10 11 L0 5 L-10 11 Z" fill="#ecebe7" stroke="#15130f" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Stops: diamonds, numbered in the order Bones picked. -->
    <g font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
      <g transform="translate(150 268)">
        <rect x="-15" y="-15" width="30" height="30" rx="5" transform="rotate(45)" fill="#e3a458" stroke="#15130f" stroke-width="3"/>
        <text y="5" fill="#1c1407">1</text>
      </g>
      <g transform="translate(232 226)">
        <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#211f26" stroke="#e3a458" stroke-width="2.5"/>
        <text y="5" fill="#ecebe7">2</text>
      </g>
      <g transform="translate(300 132)">
        <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#211f26" stroke="#e3a458" stroke-width="2.5"/>
        <text y="5" fill="#ecebe7">3</text>
      </g>
      <g transform="translate(398 92)">
        <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#211f26" stroke="#e3a458" stroke-width="2.5"/>
        <text y="5" fill="#ecebe7">4</text>
      </g>
      <g transform="translate(412 176)">
        <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#211f26" stroke="#e3a458" stroke-width="2.5"/>
        <text y="5" fill="#ecebe7">5</text>
      </g>
    </g>
    <!-- A pin: the thing to track down. -->
    <g transform="translate(250 330)">
      <path d="M0 14 C-9 3 -12 -2 -12 -7 A12 12 0 0 1 12 -7 C12 -2 9 3 0 14 Z" fill="#ecebe7" stroke="#15130f" stroke-width="2"/>
      <circle cx="0" cy="-7" r="4" fill="#15130f"/>
    </g>
  </g>
  <rect x="8.5" y="8.5" width="463" height="423" rx="17.5" fill="none" stroke="#2b2931" stroke-width="1"/>
</svg>
